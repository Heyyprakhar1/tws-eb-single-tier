<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainWithShubham</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 48px 36px;
            max-width: 640px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff4b2b 0%, #ff416c 100%);
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(255, 65, 108, 0.3);
        }
        .tag {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            color: #ffffff;
            margin-bottom: 16px;
        }
        p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-badge">TWS</div>
        <br>
        <span class="tag">DevOps &amp; Cloud</span>
        <h1>Welcome to the TrainWithShubham YouTube Channel</h1>
        <p>Learn DevOps, Cloud Computing, and modern engineering practices from scratch.</p>
    </div>
</body>
</html>
